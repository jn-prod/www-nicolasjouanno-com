---
layout: base
---

<div class="c-layout__header-bar">
  <header role="banner" class="c-layout__header">
    <div class="c-navigation">
      <a href="{{ site.url }}" class="c-navigation__title u-link--dark">
        {{ site.title }}
      </a>

      <nav aria-label="Actions du profil" class="c-navigation__actions">
        <ul class="u-list c-navigation__link-list">
          <li class="c-navigation__link-list-element">
            <a
              href="{{ site.url }}/about/"
              class="c-button {% if page.url == '/about/' %}c-button--active{% endif %}"
              {% if page.url == '/about/' %}aria-current="page"{% endif %}
              >Bio</a
            >
          </li>

          <li class="c-navigation__link-list-element">
            <a
              href="{{ site.url }}/la-sortie/subscribe/"
              class="c-button c-button--brand {% if page.url == '/la-sortie/subscribe/' %}c-button--active{% endif %}"
              {% if page.url == '/la-sortie/subscribe/' %}aria-current="page"{% endif %}
              >Suivre</a
            >
          </li>
        </ul>
      </nav>
    </div>
  </header>
</div>

<main role="main" id="main-content" class="c-layout__content">{{ content }}</main>

<footer
  role="contentinfo"
  class="c-layout__footer c-section c-section--compact"
>
  <p>
    © 2008 - {{ site.time | date: "%Y" }},
    <a href="/">{{ site.author.name }}</a>. Tous
    droits réservés.
  </p>
  {% include components/footer-links.html %}
</footer>
