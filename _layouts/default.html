---
layout: base
---

<header role="banner" class="c-layout__header">
  <div class="c-navigation">
    <a href="{{ site.url }}" class="c-navigation__title u-link--dark">
      {{ site.title }}
    </a>

    <nav
      role="navigation"
      aria-label="Navigation principale"
      class="c-navigation__topics"
    >
      <ul class="u-list c-navigation__link-list">
        <li class="c-navigation__link-list-element">
          <a
            class="c-button {% if page.url == '/outdoor/' or page.url contains '/vtt/' or page.url contains '/trail/' or page.tags contains 'outdoor' %}c-button--active{% endif %}"
            {% if page.url == '/outdoor/' or page.url contains '/vtt/' or page.url contains '/trail/' or page.tags contains 'outdoor' %}aria-current="page"{% endif %}
            href="{{ site.url }}/outdoor/"
            >Outdoor</a
          >
        </li>

        <li class="c-navigation__link-list-element">
          <a
            class="c-button {% if page.url == '/nutrition/sans-gluten.html' or page.tags contains 'sans-gluten' %}c-button--active{% endif %}"
            {% if page.url == '/nutrition/sans-gluten.html' or page.tags contains 'sans-gluten' %}aria-current="page"{% endif %}
            href="{{ site.url }}/nutrition/sans-gluten.html"
            >Sans gluten</a
          >
        </li>
      </ul>
    </nav>

    <nav aria-label="Actions du profil" class="c-navigation__actions">
      <ul class="u-list c-navigation__link-list">
        <li class="c-navigation__link-list-element">
          <a
            href="{{ site.url }}/a-propos/"
            class="c-button {% if page.url == '/a-propos/' %}c-button--active{% endif %}"
            {% if page.url == '/a-propos/' %}aria-current="page"{% endif %}
            >Bio</a
          >
        </li>

        <li class="c-navigation__link-list-element">
          <a
            href="{{ site.url }}/la-sortie/subscribe/"
            class="c-button c-button--primary {% if page.url == '/la-sortie/subscribe/' %}c-button--active{% endif %}"
            {% if page.url == '/la-sortie/subscribe/' %}aria-current="page"{% endif %}
            >Suivre</a
          >
        </li>
      </ul>
    </nav>
  </div>
</header>

<main role="main" id="main-content" class="c-layout__content">{{ content }}</main>

<footer
  role="contentinfo"
  class="c-layout__footer c-section c-section--compact"
>
  <p>
    © 2008 - {{ site.time | date: "%Y" }},
    <a href="/">{{ site.author.name }}</a>. Tous
    droits réservés. <a href="/a-propos/">À propos</a>. <a href="/mentions-legales/">Mentions légales</a>. <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>.
  </p>
</footer>
