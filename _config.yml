# collections
collections:
  redirects:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Outputting
lsi: false
safe: true
permalink: /:title:output_ext

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  # - jekyll-archives
  # - jekyll-minifier

# Minification
# jekyll-minifier:
#   exclude: 'feed.xml'

# Other
markdown: kramdown
highlighter: rouge
future: false
exclude:
  - AGENTS.md
  - CHANGELOG.md
  - CLAUDE.md
  - LICENSE.md
  - LICENSE-CODE.md
  - LICENSE-CONTENT.md
  - README.md
  - _templates
  - configs
  - docs
  - eslint.config.mjs
  - images
  - images-dist
  - node_modules
  - package.json
  - packages
  - pnpm-lock.yaml
  - renovate.json
  - scripts
  - www
sass:
  style: compressed
