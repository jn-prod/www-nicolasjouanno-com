# Site Settings
title: "Nicolas Jouanno"
description: "Nicolas Jouanno, ancien cycliste pro : La Sortie, la lettre mensuelle pour retrouver le plaisir de sortir librement, et ses archives depuis 2005."
url: "https://www.nicolasjouanno.com"
lang: "fr"
logo: "/images/icons/avatar.svg"
og_image: "/images/og/og-default.png" # carte sociale raster 1200x630 conservée en PNG pour les réseaux sociaux

# author
author:
  name: "Nicolas Jouanno"
  avatar: "/images/nicolas-jouanno.jpg"
  email: "contact@nicolasjouanno.com"
  wikipedia: "https://fr.wikipedia.org/wiki/Nicolas_Jouanno"
  knows_about:
    - "VTT"
    - "Entraînement VTT"
    - "Réglages VTT"
    - "Randonnées VTT en Bretagne"
    - "Trail"
    - "Course à pied"
    - "Progression"
    - "Outdoor"
    - "Sans gluten"
    - "Maladie cœliaque"
    - "Ravitaillement sportif sans gluten"
  # identité IndieWeb de nj.com (pas une plateforme)
  webmention: "https://webmention.io/www.nicolasjouanno.com/webmention"
  handle: "@bynicolasjd"

# Plateformes : une clé par module de l'écosystème PESOS (README, « Écosystème IndieWeb »).
# Brancher : ajouter la clé ; débrancher : la retirer. Rôles : rel_me (profil déclaré dans
# rel="me" et sameAs), onglet (onglets des canaux, dans l'ordre des clés, icône du même nom),
# ancre (onglet qui mène, sur l'accueil, à la section de son flux). Le reste est propre au module.
plateformes:
  substack:
    url: "https://bynicolasjd.substack.com/"
    libelle: "Publications — La Sortie sur Substack"
    onglet: true
    ancre: "publications"
    # La Sortie : flux dans _data/flux/substack.json, ajouté par le workflow
    # « Ajouter un post Substack » (scripts/add-substack-post.rb).
    subscribe: "https://bynicolasjd.substack.com/subscribe"
    archive: "https://bynicolasjd.substack.com/archive"
  instagram:
    url: "https://www.instagram.com/bynicolasjd/"
    libelle: "Instagram — @bynicolasjd"
    rel_me: true
    onglet: true
  youtube:
    url: "https://www.youtube.com/@byNicolasJD"
    libelle: "YouTube — @byNicolasJD"
    rel_me: true
    onglet: true
  x:
    url: "https://x.com/byNicolasJD?utm_source=www-nicolasjouanno-com&utm_medium=site&utm_campaign=ecosystem"
    libelle: "X — @byNicolasJD"
    rel_me: true
    onglet: true
  linkedin:
    url: "https://www.linkedin.com/in/nicolasjouanno/?utm_source=www-nicolasjouanno-com&utm_medium=site&utm_campaign=ecosystem"
    libelle: "LinkedIn — Nicolas Jouanno"
    rel_me: true
    onglet: true
  facebook:
    url: "https://facebook.com/502710249769535"
    libelle: "Facebook — Nicolas Jouanno"
    rel_me: true
    # abonnés de la page, relevés à la main
    abonnes: "1,2 k"
  strava:
    url: "https://www.strava.com/athletes/njouanno"
    libelle: "Strava — Nicolas Jouanno"
    rel_me: true
  github:
    url: "https://github.com/jn-prod"
    libelle: "GitHub — jn-prod"
    rel_me: true

# collections
collections:
  redirects:
    output: true
  events:
    output: false

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      category: "post"
  # Un post rangé dans _posts/archive/ est une archive : hors de /posts.html, en noindex.
  - scope:
      path: "_posts/archive"
      type: "posts"
    values:
      category: "archive"
      sitemap: false
  - scope:
      path: ""
      type: "redirects"
    values:
      sitemap: false

# Outputting
lsi: false
safe: true
permalink: /:title:output_ext

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Other
markdown: kramdown
highlighter: rouge
future: false
exclude:
  - AGENTS.md
  - CLAUDE.md
  - LICENSE-CODE.md
  - LICENSE-CONTENT.md
  - README.md
  - _templates
  - eslint.config.mjs
  - images
  - images-dist
  - node_modules
  - package.json
  - pnpm-lock.yaml
  - renovate.json
  - scripts
sass:
  style: compressed
