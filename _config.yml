# Site Settings
title: "Nicolas Jouanno"
description: "Où sortir, avec quoi et pourquoi y aller : chaque mois depuis la Bretagne, la lettre outdoor de Nicolas Jouanno, ancien cycliste pro."
url: "https://www.nicolasjouanno.com"
lang: "fr"
logo: "/images/icons/avatar.svg"
og_image: "/images/og/og-default.png" # carte sociale raster 1200x630 conservée en PNG pour les réseaux sociaux

# author
author:
  name: "Nicolas Jouanno"
  avatar: "/images/nicolas-jouanno.jpg"
  email: "contact@nicolasjouanno.com"
  wikipedia: "https://fr.wikipedia.org/wiki/Nicolas_Jouanno"
  knows_about:
    - "VTT"
    - "Entraînement VTT"
    - "Réglages VTT"
    - "Randonnées VTT en Bretagne"
    - "Trail"
    - "Course à pied"
    - "Progression"
    - "Outdoor"
    - "Sans gluten"
    - "Maladie cœliaque"
    - "Ravitaillement sportif sans gluten"
  # social
  webmention: "https://webmention.io/www.nicolasjouanno.com/webmention"
  handle: "@bynicolasjd"
  facebook: "https://facebook.com/502710249769535"
  # abonnés de la page Facebook, relevés à la main
  facebook_followers: "1,2 k"
  github: "https://github.com/jn-prod"
  instagram: "https://www.instagram.com/bynicolasjd/"
  threads: "https://www.threads.com/@bynicolasjd"
  linkedin: "https://www.linkedin.com/in/nicolasjouanno/?utm_source=www-nicolasjouanno-com&utm_medium=site&utm_campaign=ecosystem"
  strava: "https://www.strava.com/athletes/njouanno"
  twitter: "https://x.com/byNicolasJD?utm_source=www-nicolasjouanno-com&utm_medium=site&utm_campaign=ecosystem"
  youtube: "https://www.youtube.com/@byNicolasJD"

# La Sortie, sur Substack : les derniers posts de l'accueil viennent de son flux
# (scripts/fetch-substack.rb, au build).
substack:
  url: "https://bynicolasjd.substack.com/"
  feed: "https://bynicolasjd.substack.com/feed"
  subscribe: "https://bynicolasjd.substack.com/subscribe"
  archive: "https://bynicolasjd.substack.com/archive"

# projects
projects:
  events:
    url: "/events/"
    ajouter_url: "/events/ajouter.html"

# collections
collections:
  redirects:
    output: true
  events:
    output: false

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Outputting
lsi: false
safe: true
permalink: /:title:output_ext

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

# Other
markdown: kramdown
highlighter: rouge
future: false
exclude:
  - AGENTS.md
  - CLAUDE.md
  - LICENSE-CODE.md
  - LICENSE-CONTENT.md
  - README.md
  - _templates
  - eslint.config.mjs
  - images
  - images-dist
  - node_modules
  - package.json
  - pnpm-lock.yaml
  - renovate.json
  - scripts
sass:
  style: compressed
