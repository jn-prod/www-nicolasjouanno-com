<img class="c-avatar c-avatar--small" src="{{ site.author.avatar | relative_url }}" alt="Portrait de {{ site.author.name }}" width="32" height="32" loading="lazy" />
<div>
  <a href="/" class="u-link--dark">
    {{ site.author.name }}
  </a>
  <div class="c-meta">
    <span>{{ site.author.handle }}</span>
    ·
    <time
      datetime="{{ include.post.date | date_to_xmlschema }}"
    >
      {{ include.post.date | date: "%d/%m/%Y" }}
    </time>
  </div>
</div>
