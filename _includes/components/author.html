<img class="c-avatar c-avatar--small" src="/images/nicolas-jouanno.webp" alt="Portrait de {{ author.name }}" width="32" height="32" loading="lazy" />
<div>
  <a href="/" class="u-link--dark">
    {{ author.name }}
  </a>
  <div class="c-meta">
    <span>{{ author.handle }}</span>
    ·
    <time
      datetime="{{ include.post.date | date_to_xmlschema }}"
    >
      {{ include.post.date | date: "%d/%m/%Y" }}
    </time>
  </div>
</div>
