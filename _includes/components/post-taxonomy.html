{% assign item = include.item | default: post | default: page %}

<ul class="u-list c-button-stack u-spacing--none">
  {% for tag_slug in item.tags %}
    {% assign tag_page = site.pages | where: "tag", tag_slug | first %}

    <li>
      {% if tag_page %}
        <a class="c-tag" href="{{ tag_page.url }}">
          #{{ tag_slug }}
        </a>
      {% else %}
        <span class="c-tag">
          #{{ tag_slug }}
        </span>
      {% endif %}
    </li>
  {% endfor %}
</ul>
