<section class="c-event-form c-card c-card--neutral c-card--large" aria-label="Formulaire de proposition">
  <p>Le bouton prépare un e-mail : vous l'ouvrez dans votre messagerie, vous le vérifiez et vous l'envoyez vous-même. Je relis chaque proposition avant de la publier. Le nom, la date, le lieu, le club, les horaires, le tarif et le lien sont publics ; votre adresse ne l'est pas.</p>
  <form
    class="c-event-form__form"
    action="mailto:contact@nicolasjouanno.com?subject=%5B%C3%89v%C3%A9nement%5D%20Proposition"
    method="post"
    enctype="text/plain"
    data-event-form
  >
    <div class="c-event-form__field">
      <label for="event-nom">Nom de l'événement (obligatoire)</label>
      <input class="c-control" id="event-nom" name="Nom" type="text" maxlength="120" required />
    </div>
    <div class="c-event-form__field">
      <label for="event-date">Date (obligatoire)</label>
      <input class="c-control" id="event-date" name="Date" type="date" required />
    </div>
    <div class="c-event-form__field">
      <label for="event-lieu">Lieu (obligatoire)</label>
      <input class="c-control" id="event-lieu" name="Lieu" type="text" maxlength="120" required />
    </div>
    <div class="c-event-form__field">
      <label for="event-lien">Lien vers la page de l'événement</label>
      <input class="c-control" id="event-lien" name="Lien" type="text" inputmode="url" maxlength="300" />
    </div>
    <div class="c-event-form__field">
      <label for="event-discipline">Discipline</label>
      <input class="c-control" id="event-discipline" name="Discipline" type="text" maxlength="60" />
    </div>
    <div class="c-event-form__field">
      <label for="event-club">Club ou organisateur</label>
      <input class="c-control" id="event-club" name="Club" type="text" maxlength="120" />
    </div>
    <div class="c-event-form__field">
      <label for="event-horaire">Horaires</label>
      <input class="c-control" id="event-horaire" name="Horaires" type="text" maxlength="60" />
    </div>
    <div class="c-event-form__field">
      <label for="event-tarif">Tarif</label>
      <input class="c-control" id="event-tarif" name="Tarif" type="text" maxlength="60" />
    </div>
    <div class="c-event-form__field">
      <label for="event-message">Un mot (500 caractères au plus)</label>
      <textarea class="c-control" id="event-message" name="Message" rows="4" maxlength="500"></textarea>
    </div>
    <button class="c-button c-button--brand" type="submit">Préparer l'e-mail</button>
  </form>
  <noscript><p class="c-meta">Rien ne s'ouvre ? Écrivez à <a href="mailto:contact@nicolasjouanno.com">contact@nicolasjouanno.com</a> avec ces informations.</p></noscript>
</section>
<script src="/assets/js/event-form.js?v={{ site.time | date: '%s' }}" defer></script>
