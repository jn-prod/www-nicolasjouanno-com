# Questions du quiz « Gluten ou pas gluten ? ».
# answer : gluten (contient du blé, de l’orge, du seigle ou un hybride dans sa forme courante),
#          sans-gluten (naturellement sans gluten dans sa forme courante),
#          ca-depend (la recette, la filière ou l’étiquette tranche).
# source : clé de _data/gluten_quiz_sources.yml.

- text: "Pain"
  emoji: "🍞"
  answer: gluten
  difficulty: low
  explanation: "Le pain classique est fait avec de la farine de blé, qui contient du gluten. Seul un pain étiqueté « sans gluten » convient."
  source: ue-1169
- text: "Riz"
  emoji: "🍚"
