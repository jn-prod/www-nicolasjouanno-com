name: Build and deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 04:30 UTC, avant le build quotidien de vtt.bzh (05:30) qui reprend la dernière
    # édition : publie les posts datés du jour (future: false).
    - cron: "30 4 * * *"
  workflow_dispatch:
  # Appelé par « Publier un post » : un push fait avec GITHUB_TOKEN ne déclenche pas
  # d'autre workflow, la publication déploie donc elle-même le commit qu'elle a créé.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Use ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
      # Pas de `version:` ici : la version fait foi dans package.json
      # ("packageManager": "pnpm@…"). La déclarer aux deux endroits fait échouer
      # l'action ("Multiple versions of pnpm specified").
      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install node dependencies
        run: pnpm install
      - name: Privacy
        run: pnpm check:privacy
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
      - name: Lint
        run: pnpm lint
      # Inclut check:positioning, check:content-images et check:site.
      - name: Build
        run: pnpm build
      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: www.nicolasjouanno.com
      # Crée la campagne Kit d'une édition publiée depuis moins de 7 jours, en brouillon :
      # l'envoi reste un clic dans Kit.
      - name: Prepare Kit campaign
        run: node scripts/kit-broadcast.mjs
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_SEGMENT_IDS: ${{ vars.KIT_SEGMENT_IDS }}
          KIT_EMAIL_TEMPLATE_ID: ${{ vars.KIT_EMAIL_TEMPLATE_ID }}
