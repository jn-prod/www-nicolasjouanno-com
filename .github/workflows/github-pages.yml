name: Build and deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 04:30 UTC : publie les posts datés du jour (future: false) et retire du dépôt les
    # événements passés (leur historique reste dans git).
    - cron: "30 4 * * *"
  workflow_dispatch:
  # Appelé par « Publier un post » : un push fait avec GITHUB_TOKEN ne déclenche pas
  # d'autre workflow, la publication déploie donc elle-même le commit qu'elle a créé.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Historique complet sur un push : l'annulation d'un push non installable en a besoin.
          fetch-depth: ${{ github.event_name != 'push' && 1 || 0 }}
      - name: Use ruby
        id: ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
          bundler-cache: true
      # Pas de `version:` ici : la version fait foi dans package.json
      # ("packageManager": "pnpm@…"). La déclarer aux deux endroits fait échouer
      # l'action ("Multiple versions of pnpm specified").
      - name: Use pnpm
        id: pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          cache: true
      - name: Use Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Retirer les événements passés
        if: github.event_name == 'schedule'
        run: |
          node scripts/purge-events.mjs
          git add -A _events
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(events): retirer les événements passés"
            git push origin HEAD:main
          fi
      - name: Install node dependencies
        id: install
        run: pnpm install --frozen-lockfile
      # Un push qui rend le site non installable est annulé sur main ; le job reste rouge.
      - name: Annuler un push non installable
        if: >-
          failure() && github.event_name == 'push' && (steps.ruby.outcome == 'failure' ||
          steps.pnpm.outcome == 'failure' || steps.node.outcome == 'failure' ||
          steps.install.outcome == 'failure')
        env:
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
        run: bash scripts/annuler-non-installable.sh "$AVANT" "$APRES"
      - name: Privacy
        run: pnpm check:privacy
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
      - name: Lint
        run: pnpm lint
      # Inclut check:positioning, check:content-images et check:site.
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Accessibilité
        run: pnpm test:e2e
      # force_orphan : gh-pages ne garde que le build courant. Un contenu retiré du site
      # (droit à l'effacement, erreur de publication) ne survit pas dans l'historique.
      - name: Deploy GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: www.nicolasjouanno.com
          force_orphan: true
