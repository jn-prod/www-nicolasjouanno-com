name: Publier un post

# Publication sans VPS : depuis l'onglet Actions (ou l'app GitHub), choisir le brouillon.
# Le workflow lance `pnpm publish:post`, commite sur main puis déploie le site. Une
# édition de La Sortie déclenche ensuite la création de sa campagne Kit en brouillon.
on:
  workflow_dispatch:
    inputs:
      brouillon:
        description: "Brouillon dans _drafts, sans .md (ex. la-sortie-novembre-2026)"
        required: true
        type: string
      date:
        description: "Date AAAA-MM-JJ. Vide : aujourd'hui. Future : en ligne ce jour-là, au build quotidien"
        required: false
        type: string
        default: ""
      epingler:
        description: "Épingler ce post (retire l'épingle du précédent)"
        type: boolean
        default: false
      fenetre_assumee:
        description: "Publier pendant la fenêtre protégée (férié, congé : équivaut à --no-verify)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      # Même règle que le hook local, sans les fériés ni les congés (corp-ai est privé) :
      # en semaine de 08:00 à 13:00 et de 14:00 à 20:00, heure de Paris.
      - name: Fenêtre protégée
        if: ${{ !inputs.fenetre_assumee }}
        run: |
          day=$(TZ=Europe/Paris date +%u)
          now=$((10#$(TZ=Europe/Paris date +%H%M)))
          if [ "$day" -le 5 ] && { { [ "$now" -ge 800 ] && [ "$now" -lt 1300 ]; } || { [ "$now" -ge 1400 ] && [ "$now" -lt 2000 ]; }; }; then
            echo "::error::Fenêtre protégée. Choisir une date future, relancer après 20:00, ou cocher la case si c'est un férié ou un congé."
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Use ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
      - name: Publish
        env:
          BROUILLON: ${{ inputs.brouillon }}
          DATE: ${{ inputs.date }}
          EPINGLER: ${{ inputs.epingler }}
        run: |
          set -- "$BROUILLON"
          [ -n "$DATE" ] && set -- "$@" "--date=$DATE"
          [ "$EPINGLER" = "true" ] && set -- "$@" --pin
          ruby scripts/publish-post.rb "$@"
      - name: Commit
        id: commit
        env:
          BROUILLON: ${{ inputs.brouillon }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _drafts _posts
          git commit -m "publish: ${BROUILLON}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    uses: ./.github/workflows/github-pages.yml
    with:
      ref: ${{ needs.publish.outputs.sha }}
    secrets: inherit
    permissions:
      contents: write
